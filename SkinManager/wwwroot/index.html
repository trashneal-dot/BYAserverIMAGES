<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skeng Skin Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">SKENG <span>SKIN MANAGER</span></div>

    <div class="addbar">
      <input id="srcInput" type="text" placeholder="Paste a Workshop collection link, item link, or id…" />
      <select id="srcGroup" title="Add into group"></select>
      <button id="srcAdd" class="primary">Add</button>
      <label class="chk" title="Silently drop skins for items not in the server weapon/clothing catalog">
        <input type="checkbox" id="catalogFilter" checked /> Catalog only
      </label>
      <label class="chk" title="Drop skins Facepunch accepted into the game (in the Item Store) — keep only custom workshop skins">
        <input type="checkbox" id="dropOfficial" checked /> No official
      </label>
    </div>

    <div class="topright">
      <input id="search" type="text" placeholder="Search skins…" />
      <button id="loadMissions" title="Cross-reference a missions.json">Load missions.json</button>
      <span id="missionState" class="muted"></span>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="side-head">
        <span>GROUPS</span>
        <span class="side-head-btns">
          <button id="manageGroups" title="Manage groups (rename, recolor, reorder, delete)">&#9881;</button>
          <button id="addGroup" title="Quick add group">+</button>
        </span>
      </div>
      <ul id="groupList"></ul>
      <div class="side-foot">
        <div class="stat"><b id="statSkins">0</b> skins</div>
        <div class="stat"><b id="statGroups">0</b> groups</div>
      </div>
    </aside>

    <section id="content">
      <div class="gridtools">
        <div id="typebar" class="typebar hidden"></div>
        <button id="selectAll" class="ghost" title="Select / clear all shown">Select all</button>
        <div class="zoomwrap">
          <span class="zlabel">Zoom</span>
          <input id="zoom" type="range" min="110" max="280" step="10" value="158" title="Tile size" />
        </div>
      </div>
      <div id="grid"></div>
      <div id="empty" class="empty hidden">
        <p>No skins yet.</p>
        <p class="muted">Paste a Workshop collection or item link above and hit <b>Add</b>.</p>
      </div>
    </section>

    <aside id="detail" class="hidden">
      <button id="detailClose" class="x">×</button>
      <div id="detailBody"></div>
    </aside>
  </div>

  <div id="bulkbar" class="bulkbar hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="busy" class="busy hidden"><div class="spinner"></div><span id="busyText">Working…</span></div>

  <!-- Mission generator modal -->
  <div id="genModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <span>Generate mission</span>
        <button id="genClose" class="x">×</button>
      </div>
      <div id="genBody"></div>
    </div>
  </div>

  <!-- Group manager modal -->
  <div id="groupModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <span>Manage groups</span>
        <button id="groupModalClose" class="x">×</button>
      </div>
      <div id="groupModalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
